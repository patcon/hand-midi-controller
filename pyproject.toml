[project]
name = "hand-midi-controller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.13",
    "numpy>=1.24.0",
    "python-rtmidi>=1.5.0",
]

[tool.uv]
constraint-dependencies = [
    # mediapipe and jaxlib dropped macOS x86_64 (Intel) wheel support after these versions
    "mediapipe<=0.10.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "jaxlib<=0.4.38; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
